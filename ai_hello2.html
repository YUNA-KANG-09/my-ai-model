<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 포즈 분류기</title>

    <!-- TensorFlow -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

    <!-- Teachable Machine Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: '맑은 고딕', sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 2.3rem;
        }

        p {
            color: #666;
            font-size: 1.1rem;
        }

        button {
            background: #4facfe;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2196f3;
            transform: translateY(-2px);
        }

        #webcam-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        #webcam-container canvas {
            border-radius: 15px;
        }

        #label-container {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .result {
            margin: 10px 0;
            padding: 12px;
            background: #f3f7ff;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🤖 AI 포즈 분류기</h1>
    <p>웹캠으로 포즈를 실시간 분석합니다.</p>

    <button onclick="init()">시작하기</button>

    <div id="webcam-container"></div>

    <div id="label-container"></div>

</div>

<script>

const URL = "https://teachablemachine.withgoogle.com/models/uVlDUGy60/";

let model, webcam, labelContainer, maxPredictions;

async function init() {

    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    // 모델 불러오기
    model = await tmPose.load(modelURL, metadataURL);

    maxPredictions = model.getTotalClasses();

    // 웹캠 설정
    webcam = new tmPose.Webcam(400, 300, true);

    await webcam.setup();
    await webcam.play();

    // 반복 시작
    window.requestAnimationFrame(loop);

    // 기존 캔버스 제거
    document.getElementById("webcam-container").innerHTML = "";

    // 웹캠 추가
    document
        .getElementById("webcam-container")
        .appendChild(webcam.canvas);

    // 결과창 준비
    labelContainer = document.getElementById("label-container");

    labelContainer.innerHTML = "";

    for (let i = 0; i < maxPredictions; i++) {

        labelContainer.appendChild(
            document.createElement("div")
        );
    }
}

async function loop() {

    webcam.update();

    await predict();

    window.requestAnimationFrame(loop);
}

async function predict() {

    // 포즈 추정
    const { pose, posenetOutput } =
        await model.estimatePose(webcam.canvas);

    // 예측
    const prediction =
        await model.predict(posenetOutput);

    // 결과 출력
    for (let i = 0; i < maxPredictions; i++) {

        const classPrediction =
            prediction[i].className +
            " : " +
            (prediction[i].probability * 100).toFixed(1) +
            "%";

        labelContainer.childNodes[i].innerHTML =
            `<div class="result">${classPrediction}</div>`;
    }
}

</script>

</body>
</html>
